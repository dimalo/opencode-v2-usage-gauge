name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The plugin ships TypeScript that the host runs directly (Bun); the
          # tests use the Node test runner, so both are exercised here.
          node-version: "22"
          cache: npm
      - run: npm ci
      # There is no build step (no bundler, no emitted output), so the compile
      # check is tsc over the whole program, including the .tsx TUI entry.
      - name: Compile (type check)
        run: npm run compile
      - name: Unit tests
        run: npm test
